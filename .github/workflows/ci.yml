# ============================================================================
# GitHub Actions CI Pipeline — Campus RSO Platform
# ============================================================================
# 1. Quality gate  — lint, type-check and run the test suites
# 2. Security scan — committed secrets and vulnerable dependencies
# 3. Build         — Docker images for every service, pushed to GHCR
# 4. Deploy        — update the Kubernetes manifests for ArgoCD
#
# The build stage will not start unless the quality gate passes, so a failing
# test stops a broken image from ever reaching the registry.
# ============================================================================

name: CI — Test, Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rso
  NODE_VERSION: 22

jobs:
  # --------------------------------------------------------------------------
  # Quality gate — everything here must pass before anything is built
  # --------------------------------------------------------------------------
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles @rso/shared first, then every service. This is also the
      # type-check: tsc fails the job on any type error.
      # @rso/shared MUST build before the services — they import its types
      # from dist/, so nothing type-checks until it exists.
      - name: Build backend (type-check)
        run: npm run build:backend

      # Reports without blocking: the frontend currently has 61 pre-existing
      # lint errors (mostly `no-explicit-any` and react-hooks/exhaustive-deps).
      # Clear those, then remove continue-on-error to make linting a hard gate.
      - name: Lint frontend
        continue-on-error: true
        run: npm run lint -w frontend

      # Runs `tsc -b && vite build`, so this type-checks the frontend too.
      - name: Build frontend (type-check)
        run: npm run build -w frontend

      - name: Run unit & integration tests
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/services/*/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Security scanning
  # --------------------------------------------------------------------------
  # NOTE: both steps are currently set to `continue-on-error: true` so they
  # report without blocking. Flip them to false once the findings are cleared —
  # gitleaks will fail today because backend/infra/gateway/ssl/origin-key.pem
  # (a TLS private key) is committed to this repository and needs to be
  # rotated and purged from history first.
  # --------------------------------------------------------------------------
  security:
    name: Secret & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits

      - name: Scan for committed secrets
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

  # --------------------------------------------------------------------------
  # Build Frontend
  # --------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

  # --------------------------------------------------------------------------
  # Build Backend Services (matrix strategy)
  # --------------------------------------------------------------------------
  build-services:
    name: Build ${{ matrix.service }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - tenant-service
          - user-service
          - resource-service
          - booking-service
          - notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ${{ matrix.service }}
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  # --------------------------------------------------------------------------
  # Update Kubernetes manifests with new image tags
  # --------------------------------------------------------------------------
  update-manifests:
    name: Update K8s Manifests
    needs: [build-frontend, build-services]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in Kustomization
        run: |
          cd k8s/overlays/production
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|g" kustomization.yaml

      - name: Update gateway configmap hash
        run: |
          # Compute hash of the gateway nginx configmap so ArgoCD triggers a pod rollout
          CONFIGMAP_HASH=$(sha256sum k8s/base/gateway-configmap.yaml | cut -d' ' -f1)
          sed -i "s|configmap-hash:.*|configmap-hash: \"${CONFIGMAP_HASH}\"|g" k8s/base/gateway.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml k8s/base/gateway.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push
